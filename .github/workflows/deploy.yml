name: Deploy Physics-Quest to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Включить GitHub Pages, если он ещё не включён
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="${{ github.api_url }}/repos/${{ github.repository }}/pages"
          get_pages() {
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api"
          }
          info=$(get_pages)
          build=$(printf '%s' "$info" | jq -r '.build_type // empty' 2>/dev/null)
          if [ "$build" != "workflow" ]; then
            echo "Pages пока не настроен для Actions — пробую включить автоматически."
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -d '{"build_type":"workflow"}' "$api" | head -c 500 || true
            echo
            info=$(get_pages)
            build=$(printf '%s' "$info" | jq -r '.build_type // empty' 2>/dev/null)
          fi
          if [ "$build" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages не включён::Откройте Settings → Pages → Source: GitHub Actions и запустите этот workflow заново (Run workflow)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
