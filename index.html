<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#eef4fb">
    <title>Физика-Квест (7–9 классы) — Образовательная RPG-трилогия</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">
    <script>
        // Тема применяется до отрисовки: светлая по умолчанию, тёмная — по выбору ученика
        (function () {
            var t = "light";
            try { t = localStorage.getItem("pq-theme") === "dark" ? "dark" : "light"; } catch (e) {}
            document.documentElement.setAttribute("data-theme", t);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", t === "dark" ? "#081121" : "#eef4fb");
        })();
    </script>
    <link rel="stylesheet" href="./shared/platform.css">
    <style>
        :root {
            --bg-deep: #070e1c;
            --bg-card: rgba(15, 27, 51, 0.84);
            --bg-card-hover: rgba(20, 36, 68, 0.95);
            --border-soft: rgba(125, 211, 252, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --cyan: #38bdf8;
            --amber: #fbbf24;
            --emerald: #34d399;
            --violet: #a78bfa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(950px 520px at 12% -6%, rgba(56, 189, 248, 0.20), transparent 60%),
                radial-gradient(850px 480px at 88% 4%, rgba(167, 139, 250, 0.17), transparent 60%),
                radial-gradient(700px 460px at 50% 100%, rgba(16, 185, 129, 0.12), transparent 65%),
                linear-gradient(180deg, #060c18 0%, #0b162c 55%, #070e1c 100%);
            line-height: 1.5;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }

        /* Шапка портала */
        .hub-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(7, 14, 28, 0.86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-soft);
        }
        .hub-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 0.02em;
        }
        .hub-brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            display: grid;
            place-items: center;
            font-size: 20px;
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.32);
        }
        .hub-brand-sub {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .hub-nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hub-langs {
            display: inline-flex;
            padding: 3px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(148, 163, 184, 0.22);
        }
        .hub-langs button {
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.16s ease;
        }
        .hub-langs button.active {
            background: var(--cyan);
            color: #061224;
        }
        .hub-acc-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 13px;
            border-radius: 999px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(14, 116, 144, 0.24);
            color: #f0f9ff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.16s ease;
        }
        .hub-acc-pill:hover {
            background: rgba(14, 116, 144, 0.4);
            transform: translateY(-1px);
        }
        .hub-acc-pill.teacher {
            border-color: rgba(251, 191, 36, 0.5);
            background: rgba(180, 83, 9, 0.28);
            color: #fef3c7;
        }
        .hub-code-badge {
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.22);
            border: 1px solid rgba(125, 211, 252, 0.45);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: #7dd3fc;
        }

        /* Контейнер */
        .hub-wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }

        /* Hero */
        .hub-hero {
            display: grid;
            grid-template-columns: 1.35fr 0.9fr;
            gap: 24px;
            align-items: stretch;
            margin-bottom: 30px;
        }
        .hero-main {
            padding: 30px 32px;
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(15, 29, 58, 0.9), rgba(9, 18, 36, 0.92));
            border: 1px solid var(--border-soft);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.42);
            position: relative;
            overflow: hidden;
        }
        .hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #7dd3fc;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .hero-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 900;
            line-height: 1.12;
            margin-bottom: 12px;
            background: linear-gradient(95deg, #ffffff 0%, #bae6fd 52%, #fde68a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-lead {
            color: #cbd5e1;
            font-size: 15.5px;
            max-width: 640px;
            margin-bottom: 20px;
        }
        .hero-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .hero-metric {
            padding: 8px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(148, 163, 184, 0.18);
            font-size: 13px;
            color: #e2e8f0;
        }
        .hero-metric b {
            color: var(--cyan);
            font-weight: 900;
        }

        /* Правая карточка прогресса и кода ученика */
        .hero-side {
            padding: 24px 24px;
            border-radius: 24px;
            background: linear-gradient(155deg, rgba(16, 36, 68, 0.92), rgba(11, 22, 43, 0.95));
            border: 1px solid rgba(56, 189, 248, 0.28);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.38);
        }
        .id-box {
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(8, 47, 73, 0.45);
            border: 1px dashed rgba(56, 189, 248, 0.55);
        }
        .id-box-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .id-box-label {
            font-size: 11.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #bae6fd;
        }
        .id-code-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .id-code-val {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.14em;
            color: #38bdf8;
        }
        .btn-mini {
            padding: 6px 11px;
            border-radius: 9px;
            border: 1px solid rgba(125, 211, 252, 0.4);
            background: rgba(56, 189, 248, 0.16);
            color: #e0f2fe;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-mini:hover { background: rgba(56, 189, 248, 0.3); }

        .series-progress-box {
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }
        .sp-head {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .sp-track {
            height: 10px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .sp-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #38bdf8, #34d399, #fbbf24);
            transition: width 0.35s ease;
        }
        .sp-sub {
            margin-top: 7px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Карточки 7, 8, 9 классов */
        .section-heading {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px 12px;
            margin: 8px 0 16px;
        }
        .section-heading h2 {
            font-size: 21px;
            font-weight: 900;
        }
        .section-heading span {
            font-size: 13px;
            color: var(--text-muted);
        }

        .grades-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }
        .grade-card {
            border-radius: 22px;
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .grade-card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: var(--card-accent, #38bdf8);
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
        }
        .grade-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--card-accent, #38bdf8);
        }
        .gc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .gc-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 900;
            background: rgba(255, 255, 255, 0.08);
            color: var(--card-accent, #38bdf8);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .gc-part {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .gc-title {
            font-size: 21px;
            font-weight: 900;
            line-height: 1.22;
            margin-top: 8px;
        }
        .gc-world {
            font-size: 13px;
            font-weight: 700;
            color: var(--card-accent, #38bdf8);
            margin-top: 4px;
        }
        .gc-desc {
            font-size: 13.5px;
            color: #cbd5e1;
            margin-top: 8px;
        }
        .gc-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .gc-tag {
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.16);
            color: #e2e8f0;
        }
        .gc-prog {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(7, 14, 28, 0.65);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }
        .gc-prog-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #e2e8f0;
        }
        .gc-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-play {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 13px;
            font-size: 14.5px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            color: #061224;
            background: var(--card-accent, #38bdf8);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .btn-play:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }
        .gc-subactions {
            display: flex;
            gap: 8px;
        }
        .btn-ghost {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 11px;
            font-size: 12px;
            font-weight: 800;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.22);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.11);
            color: #fff;
        }

        /* Двухколоночный блок: Быстрый код задания ученика + Единый кабинет учителя */
        .hub-panels {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .hub-panel {
            padding: 24px;
            border-radius: 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
        }
        .hub-panel.teacher-panel {
            border-color: rgba(251, 191, 36, 0.32);
            background: linear-gradient(155deg, rgba(28, 25, 43, 0.88), rgba(15, 23, 42, 0.92));
        }
        .hub-panel h3 {
            font-size: 19px;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .hub-panel p {
            font-size: 13.5px;
            color: #cbd5e1;
            margin-bottom: 14px;
        }
        .code-form {
            display: flex;
            gap: 8px;
        }
        .code-form input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(125, 211, 252, 0.35);
            background: rgba(7, 14, 28, 0.85);
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            outline: none;
        }
        .code-form input:focus { border-color: var(--cyan); }
        .code-form button {
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #fff;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .code-status {
            margin-top: 8px;
            font-size: 12.5px;
            min-height: 18px;
            font-weight: 700;
        }
        .active-assign-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .active-assign-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 11px;
            background: rgba(56, 189, 248, 0.09);
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-size: 12.5px;
        }

        .teacher-kpis {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .tkpi {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(251, 191, 36, 0.22);
            text-align: center;
        }
        .tkpi b {
            display: block;
            font-size: 20px;
            font-weight: 900;
            color: #fde68a;
        }
        .tkpi span {
            font-size: 11.5px;
            color: #cbd5e1;
        }
        .teacher-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn-teacher-main {
            flex: 1.3;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #1c1102;
            font-weight: 900;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn-teacher-sec {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.38);
            color: #fef3c7;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }

        /* О серии и дипломном проекте */
        .about-series {
            padding: 26px 28px;
            border-radius: 22px;
            background: rgba(12, 23, 44, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }
        .about-series h3 {
            font-size: 19px;
            font-weight: 900;
            margin-bottom: 10px;
            color: #e0f2fe;
        }
        .about-cols {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 14px;
        }
        .about-col {
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(148, 163, 184, 0.14);
        }
        .about-col h4 {
            font-size: 14px;
            font-weight: 800;
            color: var(--cyan);
            margin-bottom: 6px;
        }
        .about-col p {
            font-size: 13px;
            color: #cbd5e1;
        }
        .hub-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        @media (max-width: 960px) {
            .hub-hero, .grades-grid, .hub-panels, .about-cols {
                grid-template-columns: 1fr;
            }
            .hub-nav { padding: 10px 14px; }
        }

        .hub-features {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin: 26px 0 8px;
            align-items: stretch;
        }
        .hf-head { grid-column: 1 / -1; display: grid; gap: 5px; margin: 0 0 2px; }
        .hf-kicker { font-size: 11px; font-weight: 900; letter-spacing: .16em; color: #38bdf8; }
        .hf-head h3 { margin: 0; font-size: clamp(18px, 2.1vw, 23px); color: #eaf3ff; letter-spacing: .01em; }
        .hub-feature-link { text-decoration: none; color: inherit; border-color: rgba(56, 189, 248, .45); }
        .hub-feature-link:hover { transform: translateY(-2px); border-color: rgba(56, 189, 248, .8); }
        .hub-feature {
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: linear-gradient(165deg, rgba(17, 30, 58, 0.92), rgba(9, 18, 38, 0.96));
            border: 1px solid rgba(96, 165, 250, 0.22);
            border-radius: 20px;
            padding: 16px 17px 15px;
            box-shadow: 0 16px 40px rgba(2, 8, 22, 0.35);
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
        }
        .hub-feature::before {
            content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
            background: linear-gradient(90deg, var(--fc), transparent 92%);
        }
        .hub-feature::after {
            content: ""; position: absolute; right: -52px; top: -62px; width: 164px; height: 164px;
            border-radius: 50%; background: radial-gradient(circle at center, var(--fc-soft), transparent 68%);
            pointer-events: none;
        }
        .hub-feature:hover {
            transform: translateY(-3px);
            border-color: var(--fc);
            box-shadow: 0 22px 46px rgba(2, 8, 22, 0.45);
        }
        .hf-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
        .hf-icon {
            width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
            font-size: 20px; background: var(--fc-soft); border: 1px solid var(--fc-soft);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .hf-num { font-size: 11px; font-weight: 900; letter-spacing: .12em; color: rgba(148, 178, 214, 0.55); }
        .hf-title { font-weight: 800; font-size: 15px; line-height: 1.25; color: #eaf3ff; margin-bottom: 5px; }
        .hf-desc { font-size: 12.4px; line-height: 1.5; color: #9fb3cf; }
        .hf-list { margin: auto 0 0; padding: 12px 0 0; list-style: none; display: grid; gap: 6px; }
        .hf-list li {
            position: relative; padding-left: 18px; font-size: 12px; line-height: 1.42; color: #b8cbe4;
        }
        .hf-list li::before {

        function tr(key, ...args) {
            const L = getLang();
            let text = (PORTAL_TEXT[L] && PORTAL_TEXT[L][key]) || PORTAL_TEXT.ru[key] || key;
            args.forEach((a, idx) => { text = text.replace("{" + idx + "}", a); });
            return text;
        }

        function countCompleted(g) {
            const prog = Storage.getProgressForGrade(g);
            const completed = (prog && prog.completedLevels) || {};
            const total = (window.GRADE_CATALOG && window.GRADE_CATALOG[g] && window.GRADE_CATALOG[g].levels.length) || 50;
            let done = 0;
            for (let i = 1; i <= total; i++) {
                if (completed[i]) done++;
            }
            let nextLvl = 1;
            for (let i = 1; i <= total; i++) {
                if (!completed[i]) { nextLvl = i; break; }
            }
            return { done, total, nextLvl };
        }
