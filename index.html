<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#081121">
    <title>Физика-Квест (7–9 классы) — Образовательная RPG-трилогия</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">
    <link rel="stylesheet" href="./shared/platform.css">
    <style>
        :root {
            --bg-deep: #070e1c;
            --bg-card: rgba(15, 27, 51, 0.84);
            --bg-card-hover: rgba(20, 36, 68, 0.95);
            --border-soft: rgba(125, 211, 252, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --cyan: #38bdf8;
            --amber: #fbbf24;
            --emerald: #34d399;
            --violet: #a78bfa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(950px 520px at 12% -6%, rgba(56, 189, 248, 0.20), transparent 60%),
                radial-gradient(850px 480px at 88% 4%, rgba(167, 139, 250, 0.17), transparent 60%),
                radial-gradient(700px 460px at 50% 100%, rgba(16, 185, 129, 0.12), transparent 65%),
                linear-gradient(180deg, #060c18 0%, #0b162c 55%, #070e1c 100%);
            line-height: 1.5;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }

        /* Шапка портала */
        .hub-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(7, 14, 28, 0.86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-soft);
        }
        .hub-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 0.02em;
        }
        .hub-brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            display: grid;
            place-items: center;
            font-size: 20px;
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.32);
        }
        .hub-brand-sub {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .hub-nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hub-langs {
            display: inline-flex;
            padding: 3px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(148, 163, 184, 0.22);
        }
        .hub-langs button {
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.16s ease;
        }
        .hub-langs button.active {
            background: var(--cyan);
            color: #061224;
        }
        .hub-acc-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 13px;
            border-radius: 999px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(14, 116, 144, 0.24);
            color: #f0f9ff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.16s ease;
        }
        .hub-acc-pill:hover {
            background: rgba(14, 116, 144, 0.4);
            transform: translateY(-1px);
        }
        .hub-acc-pill.teacher {
            border-color: rgba(251, 191, 36, 0.5);
            background: rgba(180, 83, 9, 0.28);
            color: #fef3c7;
        }
        .hub-code-badge {
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.22);
            border: 1px solid rgba(125, 211, 252, 0.45);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: #7dd3fc;
        }

        /* Контейнер */
        .hub-wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }

        /* Hero */
        .hub-hero {
            display: grid;
            grid-template-columns: 1.35fr 0.9fr;
            gap: 24px;
            align-items: stretch;
            margin-bottom: 30px;
        }
        .hero-main {
            padding: 30px 32px;
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(15, 29, 58, 0.9), rgba(9, 18, 36, 0.92));
            border: 1px solid var(--border-soft);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.42);
            position: relative;
            overflow: hidden;
        }
        .hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #7dd3fc;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .hero-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 900;
            line-height: 1.12;
            margin-bottom: 12px;
            background: linear-gradient(95deg, #ffffff 0%, #bae6fd 52%, #fde68a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-lead {
            color: #cbd5e1;
            font-size: 15.5px;
            max-width: 640px;
            margin-bottom: 20px;
        }
        .hero-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .hero-metric {
            padding: 8px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(148, 163, 184, 0.18);
            font-size: 13px;
            color: #e2e8f0;
        }
        .hero-metric b {
            color: var(--cyan);
            font-weight: 900;
        }

        /* Правая карточка прогресса и кода ученика */
        .hero-side {
            padding: 24px 24px;
            border-radius: 24px;
            background: linear-gradient(155deg, rgba(16, 36, 68, 0.92), rgba(11, 22, 43, 0.95));
            border: 1px solid rgba(56, 189, 248, 0.28);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.38);
        }
        .id-box {
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(8, 47, 73, 0.45);
            border: 1px dashed rgba(56, 189, 248, 0.55);
        }
        .id-box-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .id-box-label {
            font-size: 11.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #bae6fd;
        }
        .id-code-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .id-code-val {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.14em;
            color: #38bdf8;
        }
        .btn-mini {
            padding: 6px 11px;
            border-radius: 9px;
            border: 1px solid rgba(125, 211, 252, 0.4);
            background: rgba(56, 189, 248, 0.16);
            color: #e0f2fe;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-mini:hover { background: rgba(56, 189, 248, 0.3); }

        .series-progress-box {
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }
        .sp-head {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .sp-track {
            height: 10px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .sp-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #38bdf8, #34d399, #fbbf24);
            transition: width 0.35s ease;
        }
        .sp-sub {
            margin-top: 7px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Карточки 7, 8, 9 классов */
        .section-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin: 8px 0 16px;
        }
        .section-heading h2 {
            font-size: 21px;
            font-weight: 900;
        }
        .section-heading span {
            font-size: 13px;
            color: var(--text-muted);
        }

        .grades-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }
        .grade-card {
            border-radius: 22px;
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .grade-card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: var(--card-accent, #38bdf8);
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
        }
        .grade-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--card-accent, #38bdf8);
        }
        .gc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .gc-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 900;
            background: rgba(255, 255, 255, 0.08);
            color: var(--card-accent, #38bdf8);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .gc-part {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .gc-title {
            font-size: 21px;
            font-weight: 900;
            line-height: 1.22;
            margin-top: 8px;
        }
        .gc-world {
            font-size: 13px;
            font-weight: 700;
            color: var(--card-accent, #38bdf8);
            margin-top: 4px;
        }
        .gc-desc {
            font-size: 13.5px;
            color: #cbd5e1;
            margin-top: 8px;
        }
        .gc-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .gc-tag {
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.16);
            color: #e2e8f0;
        }
        .gc-prog {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(7, 14, 28, 0.65);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }
        .gc-prog-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #e2e8f0;
        }
        .gc-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-play {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 13px;
            font-size: 14.5px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            color: #061224;
            background: var(--card-accent, #38bdf8);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .btn-play:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }
        .gc-subactions {
            display: flex;
            gap: 8px;
        }
        .btn-ghost {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 11px;
            font-size: 12px;
            font-weight: 800;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.22);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.11);
            color: #fff;
        }

        /* Двухколоночный блок: Быстрый код задания ученика + Единый кабинет учителя */
        .hub-panels {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .hub-panel {
            padding: 24px;
            border-radius: 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
        }
        .hub-panel.teacher-panel {
            border-color: rgba(251, 191, 36, 0.32);
            background: linear-gradient(155deg, rgba(28, 25, 43, 0.88), rgba(15, 23, 42, 0.92));
        }
        .hub-panel h3 {
            font-size: 19px;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .hub-panel p {
            font-size: 13.5px;
            color: #cbd5e1;
            margin-bottom: 14px;
        }
        .code-form {
            display: flex;
            gap: 8px;
        }
        .code-form input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(125, 211, 252, 0.35);
            background: rgba(7, 14, 28, 0.85);
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            outline: none;
        }
        .code-form input:focus { border-color: var(--cyan); }
        .code-form button {
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #fff;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .code-status {
            margin-top: 8px;
            font-size: 12.5px;
            min-height: 18px;
            font-weight: 700;
        }
        .active-assign-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .active-assign-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 11px;
            background: rgba(56, 189, 248, 0.09);
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-size: 12.5px;
        }

        .teacher-kpis {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .tkpi {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(251, 191, 36, 0.22);
            text-align: center;
        }
        .tkpi b {
            display: block;
            font-size: 20px;
            font-weight: 900;
            color: #fde68a;
        }
        .tkpi span {
            font-size: 11.5px;
            color: #cbd5e1;
        }
        .teacher-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn-teacher-main {
            flex: 1.3;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #1c1102;
            font-weight: 900;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn-teacher-sec {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.38);
            color: #fef3c7;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }

        /* О серии и дипломном проекте */
        .about-series {
            padding: 26px 28px;
            border-radius: 22px;
            background: rgba(12, 23, 44, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }
        .about-series h3 {
            font-size: 19px;
            font-weight: 900;
            margin-bottom: 10px;
            color: #e0f2fe;
        }
        .about-cols {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 14px;
        }
        .about-col {
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(148, 163, 184, 0.14);
        }
        .about-col h4 {
            font-size: 14px;
            font-weight: 800;
            color: var(--cyan);
            margin-bottom: 6px;
        }
        .about-col p {
            font-size: 13px;
            color: #cbd5e1;
        }
        .hub-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        @media (max-width: 960px) {
            .hub-hero, .grades-grid, .hub-panels, .about-cols {
                grid-template-columns: 1fr;
            }
            .hub-nav { padding: 10px 14px; }
        }

        .hub-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
            margin: 26px 0 8px;
        }
        .hub-feature-link { text-decoration: none; color: inherit; border-color: rgba(56, 189, 248, .45); }
        .hub-feature-link:hover { transform: translateY(-2px); border-color: rgba(56, 189, 248, .8); }
        .hub-feature {
            background: linear-gradient(160deg, rgba(17, 30, 58, 0.9), rgba(9, 18, 38, 0.94));
            border: 1px solid rgba(96, 165, 250, 0.22);
            border-radius: 18px;
            padding: 16px 18px;
            box-shadow: 0 16px 40px rgba(2, 8, 22, 0.35);
        }
        .hf-icon { font-size: 26px; margin-bottom: 6px; }
        .hf-title { font-weight: 800; font-size: 15px; color: #eaf3ff; margin-bottom: 4px; }
        .hf-desc { font-size: 12.8px; line-height: 1.5; color: #9fb3cf; }
    </style>
</head>
<body>
    <header class="hub-nav">
        <div class="hub-brand">
            <div class="hub-brand-logo">⚛️</div>
            <div>
                <span id="brand-title">ФИЗИКА-КВЕСТ</span>
                <span class="hub-brand-sub" id="brand-sub">ОБРАЗОВАТЕЛЬНАЯ RPG-СЕРИЯ · 7–9 КЛАССЫ</span>
            </div>
        </div>
        <div class="hub-nav-right">
            <div class="hub-langs" role="group" aria-label="Language">
                <button type="button" data-lang="ru" class="active">RU</button>
                <button type="button" data-lang="kk">ҚАЗ</button>
                <button type="button" data-lang="en">EN</button>
            </div>
            <button type="button" class="hub-acc-pill" id="hub-account-btn"></button>
        </div>
    </header>

    <main class="hub-wrap" id="hub-app"></main>

    <script src="./shared/account.js"></script>
    <script src="./shared/catalog-789.js"></script>
    <script src="./shared/levels.js"></script>
    <script src="./shared/storage.js"></script>
    <script src="./shared/offline-manifest.js"></script>
    <script src="./shared/sound.js"></script>
    <script src="./shared/offline.js"></script>
    <script>
    (function () {
        // Если на главную страницу пришли со ссылкой #a=… или #res=… — сразу направляем в нужную параллель!
        const hash = String(window.location.hash || "");
        if (hash.indexOf("#a=") === 0) {
            const m = hash.match(/#a=[A-Z0-9]+\.g([789])l\d+/i) || hash.match(/#a=Q([789])/i);
            const g = m ? Number(m[1]) : 8;
            window.location.replace("./play.html?grade=" + g + hash);
            return;
        }
        if (hash.indexOf("#res=") === 0) {
            window.location.replace("./play.html?grade=8" + hash);
            return;
        }

        const PORTAL_TEXT = {
            ru: {
                brandTitle: "ФИЗИКА-КВЕСТ",
                brandSub: "ОБРАЗОВАТЕЛЬНАЯ RPG-СЕРИЯ · 7–9 КЛАССЫ",

            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function getLang() {
            const acc = window.PQAccount ? window.PQAccount.get() : null;
            return (acc && acc.language) || "ru";
        }

        function tr(key, ...args) {
            const L = getLang();
            let text = (PORTAL_TEXT[L] && PORTAL_TEXT[L][key]) || PORTAL_TEXT.ru[key] || key;
            args.forEach((a, idx) => { text = text.replace("{" + idx + "}", a); });
            return text;
        }

        function countCompleted(g) {
            const prog = Storage.getProgressForGrade(g);
            const completed = (prog && prog.completedLevels) || {};
            const total = (window.GRADE_CATALOG && window.GRADE_CATALOG[g] && window.GRADE_CATALOG[g].levels.length) || 50;
            let done = 0;
            for (let i = 1; i <= total; i++) {
                if (completed[i]) done++;
            }
            let nextLvl = 1;
            for (let i = 1; i <= total; i++) {
                if (!completed[i]) { nextLvl = i; break; }
            }
            return { done, total, nextLvl };
        }

                    title: tr("g7Title"), world: tr("g7World"), desc: tr("g7Desc"),
                    tags: tr("g7Tags"), prog: p7,
                    pdfUrl: `./assets/pdf/grade7-${L}.pdf`,
                    pdfName: `Физика-Квест_7-класс_Конспект_${L.toUpperCase()}.pdf`
                },
                {
                    g: 8, accent: "#fbbf24", part: tr("part2"),
                    title: tr("g8Title"), world: tr("g8World"), desc: tr("g8Desc"),
                    tags: tr("g8Tags"), prog: p8,
                    pdfUrl: null, pdfName: null
                },
                {
                    g: 9, accent: "#a78bfa", part: tr("part3"),
                    title: tr("g9Title"), world: tr("g9World"), desc: tr("g9Desc"),
                    tags: tr("g9Tags"), prog: p9,
                    pdfUrl: `./assets/pdf/grade9-${L}.pdf`,
                    pdfName: `Физика-Квест_9-класс_Конспект_${L.toUpperCase()}.pdf`
                }
            ];

            const app = document.getElementById("hub-app");
            app.innerHTML = `
                <section class="hub-hero">
                    <div class="hero-main">
                        <div class="hero-kicker">${tr("heroKicker")}</div>
                        <h1 class="hero-title">${esc(tr("heroTitle"))}</h1>
                        <p class="hero-lead">${esc(tr("heroLead"))}</p>
                        <div class="hero-metrics">
                            <div class="hero-metric">${tr("mLevels")}</div>
                            <div class="hero-metric">${tr("mTasks")}</div>
                            <div class="hero-metric">${tr("mLabs")}</div>
                            <div class="hero-metric">${tr("mLangs")}</div>
                        </div>
                    </div>
                    <aside class="hero-side">
                        <div class="id-box">
                            <div class="id-box-top">
                                <span class="id-box-label">${esc(tr("permCodeLabel"))}</span>
                                <button type="button" class="btn-mini" id="btn-switch-role">${esc(tr("changeRoleBtn"))}</button>
                            </div>
                            <div class="id-code-row">
                                <span class="id-code-val">${esc(acc.student.studentCode)}</span>
                                <button type="button" class="btn-mini" id="btn-copy-perm-code">${esc(tr("copyBtn"))}</button>
                            </div>
                        </div>
                        <div class="series-progress-box">
                            <div class="sp-head">
                                <span>${esc(tr("seriesProgTitle"))}</span>
                                <span>${totalPct}%</span>
                            </div>
                            <div class="sp-track"><div class="sp-fill" style="width:${totalPct}%"></div></div>
                            <div class="sp-sub">${esc(tr("seriesProgSub", totalDone, totalLevels))}</div>
                        </div>
                    </aside>
                </section>

                <div class="section-heading">
                    <h2>${esc(tr("chooseHeading"))}</h2>
                    <span>${esc(tr("chooseSub"))}</span>
                </div>

                <section class="grades-grid">
                    ${cards.map(c => {
                        const pct = Math.round((c.prog.done / c.prog.total) * 100);
                        const hasStarted = c.prog.done > 0;
                        const playHref = hasStarted
                            ? `./play.html?grade=${c.g}&autostart=${c.prog.nextLvl}`
                            : `./play.html?grade=${c.g}`;
                        const playText = hasStarted
                            ? tr("playContinue", c.prog.nextLvl)
                            : tr("playStart");
                        return `
                        <article class="grade-card" style="--card-accent:${c.accent}">
                            <div>
                                <div class="gc-top">
                                    <span class="gc-badge">⚛️ ${esc(c.part)}</span>
                                    <span class="gc-part">${pct}%</span>
                                </div>
                                <h3 class="gc-title">${esc(c.title)}</h3>
                                <div class="gc-world">${esc(c.world)}</div>
                                <p class="gc-desc">${esc(c.desc)}</p>
                                <div class="gc-tags">
                                    ${c.tags.map(t => `<span class="gc-tag">${esc(t)}</span>`).join("")}
                                </div>
                            </div>
                            <div>
                                <div class="gc-prog" style="margin-bottom:12px;">
                                    <div class="gc-prog-row">
                                        <span>${esc(tr("completedLabel"))}</span>
                                        <span>${c.prog.done} / ${c.prog.total}</span>
                                    </div>
                                    <div class="sp-track"><div class="sp-fill" style="width:${pct}%;background:${c.accent}"></div></div>
                                </div>
                                <div class="gc-actions">
                                    <a class="btn-play" href="${playHref}">${esc(playText)}</a>
                                    <div class="gc-subactions">
                                        <a class="btn-ghost" href="./play.html?grade=${c.g}">${esc(tr("levelsListBtn"))}</a>
                                        ${c.pdfUrl
                                            ? `<a class="btn-ghost" href="${c.pdfUrl}" download="${esc(c.pdfName)}">${esc(tr("pdfBtn"))}</a>`
                                            : `<a class="btn-ghost" href="./play.html?grade=8">${esc(tr("conspektBtn"))}</a>`
                                        }
                                    </div>
                                </div>
                            </div>
                        </article>`;
                    }).join("")}
                </section>

                <section class="hub-panels">
                    <div class="hub-panel">
                        <h3>${esc(tr("studentPanelTitle"))}</h3>
                        <p>${esc(tr("studentPanelDesc"))}</p>
                        <form class="code-form" id="portal-code-form">
                            <input type="text" id="portal-assign-input" placeholder="${esc(tr("codePh"))}" maxlength="12" autocomplete="off">
                            <button type="submit">${esc(tr("openCodeBtn"))}</button>
                        </form>
                        <div class="code-status" id="portal-code-status"></div>
                        ${myAssigns.length ? `
                            <div class="active-assign-list">
                                <div style="font-size:12px;font-weight:800;color:#94a3b8;">${esc(tr("myAssignsTitle"))}</div>
                                ${myAssigns.map(a => {
                                    const parsed = parseLevelRef(a.levelId, a.grade || 8);
                                    const label = catalogLevelLabel(parsed.canonical, parsed.grade, true);
                                    const href = `./play.html?grade=${parsed.grade}&autostart=${encodeURIComponent(parsed.levelId)}&assign=${encodeURIComponent(a.assignmentCode || "")}`;
                                    return `<div class="active-assign-item">
                                        <span><b>${esc(a.assignmentCode || "")}</b> · ${esc(label)}</span>
                                        <a class="btn-mini" href="${href}">${esc(tr("openAssignBtn"))}</a>
                                    </div>`;
                                }).join("")}
                            </div>
                        ` : ""}
                    </div>

                    <div class="hub-panel teacher-panel">
                        <h3>${esc(tr("teacherPanelTitle"))}</h3>
                        <p>${esc(tr("teacherPanelDesc"))}</p>
                        <div class="teacher-kpis">
                            <div class="tkpi"><b>${classesCount}</b><span>${esc(tr("kpiClasses"))}</span></div>
                            <div class="tkpi"><b>${uniqueBatches}</b><span>${esc(tr("kpiAssigns"))}</span></div>
                            <div class="tkpi"><b>${teacherResults}</b><span>${esc(tr("kpiResults"))}</span></div>
                        </div>
                        <div class="teacher-btns">
                            <a class="btn-teacher-main" href="./play.html?grade=${acc.student.grade || 8}#teacher">${esc(tr("openJournalBtn"))}</a>
                            <button type="button" class="btn-teacher-sec" id="btn-portal-teacher-login">${esc(tr("teacherLoginBtn"))}</button>
                        </div>
                    </div>
                </section>

                <section class="about-series">
                    <h3>${esc(tr("aboutTitle"))}</h3>
                    <p style="font-size:14px;color:#cbd5e1;">${esc(tr("aboutLead"))}</p>
                    <div class="about-cols">
                        <div class="about-col">
                            <h4>${esc(tr("ab1Title"))}</h4>
                            <p>${esc(tr("ab1Text"))}</p>
                        </div>
                        <div class="about-col">
                            <h4>${esc(tr("ab2Title"))}</h4>
                            <p>${esc(tr("ab2Text"))}</p>
                        </div>
                        <div class="about-col">
                            <h4>${esc(tr("ab3Title"))}</h4>
                            <p>${esc(tr("ab3Text"))}</p>
                        </div>
                    </div>
                </section>

                <section class="hub-features" id="pq-hub-features">
                    ${[
                        { icon: "🧮", t: { ru: "Умный разбор задач", kk: "Есептерді ақылды талдау", en: "Smart problem solver" },
                          d: { ru: "Дано → СИ → Формула → Решение и карточка формул параграфа прямо в окне задачи.", kk: "Берілгені → ХБ → Формула → Шешуі және параграф формулаларының карточкасы тапсырма терезесінде.", en: "Given → SI → Formula → Solution plus a chapter formula card right inside the task window." } },
                        { icon: "🏟", t: { ru: "Битва экипажей", kk: "Экипаждар сайысы", en: "Crew battle" },
                          d: { ru: "Режим интерактивной доски: 2–3 команды защищают щит города у проектора.", kk: "Интерактивті тақта режимі: 2–3 команда проекторда қала қалқанын қорғайды.", en: "Interactive whiteboard mode: 2–3 teams defend the city shield on the projector." } },
                        { icon: "🎖", t: { ru: "Паспорт пилота", kk: "Пилот паспорты", en: "Pilot passport" },
                          d: { ru: "Именной сертификат с рангами по 7, 8 и 9 классам — PNG или PDF для портфолио.", kk: "7, 8 және 9 сынып рангылары бар атаулы сертификат — портфолио үшін PNG немесе PDF.", en: "A personalised certificate with ranks for Grades 7, 8 and 9 — PNG or PDF for your portfolio." } },
                        { icon: "📥", t: { ru: "Офлайн-режим", kk: "Офлайн режим", en: "Offline mode" },
                          d: { ru: "PWA-кэш и скачивание ZIP: игра работает даже без интернета в кабинете.", kk: "PWA кэші және ZIP жүктеу: ойын кабинетте интернетсіз де жұмыс істейді.", en: "PWA caching and ZIP download: the game works even without internet in the classroom." } },
                        { icon: "🖼", href: "./screenshots.html", t: { ru: "Скриншоты симуляторов", kk: "Симуляторлар скриншоттары", en: "Simulator screenshots" },
                          d: { ru: "18 мини-игр и лабораторий: кадры реальных сцен, формулы и задания к каждому опыту.", kk: "18 мини-ойын мен зертхана: нақты сахналардың кадрлары, формулалар мен тапсырмалар.", en: "18 mini-games and labs: real scene frames, formulas and a task for every experiment." } }
                    ].map(f => `
                        <${f.href ? "a" : "article"} class="hub-feature${f.href ? " hub-feature-link" : ""}" ${f.href ? `href="${f.href}"` : ""}>
                            <div class="hf-icon">${f.icon}</div>
                            <div class="hf-title">${esc(f.t[L] || f.t.ru)}</div>
                            <div class="hf-desc">${esc(f.d[L] || f.d.ru)}</div>
                        </${f.href ? "a" : "article"}>`).join("")}
                </section>

                <footer class="hub-footer">${esc(tr("footer"))}</footer>
            `;

            // Обработчики внутри портала
            document.getElementById("btn-switch-role")?.addEventListener("click", () => {
                window.PQAccount.openModal({ onboarding: false, onComplete: renderPortal });
            });

            document.getElementById("btn-copy-perm-code")?.addEventListener("click", (e) => {
                const btn = e.currentTarget;
                const code = window.PQAccount.get().student.studentCode;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(code).catch(() => {});
                }
                btn.textContent = tr("copiedBtn");
                setTimeout(() => { btn.textContent = tr("copyBtn"); }, 1600);
            });

            document.getElementById("btn-portal-teacher-login")?.addEventListener("click", () => {
                window.PQAccount.openModal({
                    onboarding: false,
                    role: "teacher",
                    onComplete: (updated) => {
                        renderPortal();
                        if (updated && updated.role === "teacher") {
                            window.location.href = "./play.html?grade=8#teacher";
                        }
                    }
                });
            });

            document.getElementById("portal-code-form")?.addEventListener("submit", (e) => {
                e.preventDefault();
                const input = document.getElementById("portal-assign-input");
                const status = document.getElementById("portal-code-status");
                const raw = String(input?.value || "").trim().toUpperCase();
                if (!raw) {
                    status.style.color = "#fca5a5";
                    status.textContent = tr("codeErrEmpty");
                    return;
                }
                const outcome = Storage.attachAssignmentCode(raw);
                if (outcome.notFound || !outcome.assignment) {
                    status.style.color = "#fca5a5";
                    status.textContent = tr("codeErrNotFound");
                    return;
                }
                const parsed = parseLevelRef(outcome.assignment.levelId, outcome.assignment.grade || 8);
                window.location.href = `./play.html?grade=${parsed.grade}&autostart=${encodeURIComponent(parsed.levelId)}&assign=${encodeURIComponent(outcome.assignment.assignmentCode || raw)}`;
            });
        }

        // Языковые кнопки шапки
        document.querySelectorAll(".hub-langs button").forEach(btn => {
            btn.addEventListener("click", () => {
                window.PQAccount.setLanguage(btn.dataset.lang);
                renderPortal();
            });
        });

        document.getElementById("hub-account-btn")?.addEventListener("click", () => {
            window.PQAccount.openModal({ onboarding: false, onComplete: renderPortal });
        });

        window.addEventListener("pq:account-changed", renderPortal);
        window.addEventListener("pq:lang-changed", renderPortal);

        renderPortal();

        // Показываем однократный стартовый экран выбора аккаунта (Ученик / Учитель) при первом входе!
        window.PQAccount.maybeShowOnboarding({
            onComplete: (acc) => {
                renderPortal();
                if (acc && acc.role === "teacher") {
                    window.location.href = "./play.html?grade=8#teacher";
                }
            }
        });
    })();
    </script>
</body>
</html>
